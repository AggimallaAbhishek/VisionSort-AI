services:
  - type: web
    name: visionsort-ai-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_UPLOADS_BUCKET
        sync: false
      - key: S3_PROCESSED_BUCKET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        value: ^https://.*\\.vercel\\.app$
      - key: ALLOWED_HOSTS
        sync: false
      - key: BACKEND_API_KEY
        sync: false
      - key: ENABLE_API_DOCS
        value: "false"
      - key: EXPOSE_HEALTH_DETAILS
        value: "true"
      - key: SECURITY_HEADERS_ENABLED
        value: "true"
      - key: HSTS_MAX_AGE_SECONDS
        value: "31536000"
      - key: DEFAULT_USER_ID
        value: anonymous
      - key: BLUR_THRESHOLD
        value: "100"
      - key: DUPLICATE_HASH_DISTANCE
        value: "5"
      - key: MAX_IMAGE_WIDTH
        value: "1024"
      - key: PREVIEW_MAX_WIDTH
        value: "640"
      - key: PREVIEW_JPEG_QUALITY
        value: "70"
      - key: INCLUDE_PREVIEW_DATA_URL
        value: "false"
      - key: PREVIEW_INLINE_MAX_FILES
        value: "0"
      - key: MAX_FILE_SIZE_MB
        value: "100"
      - key: MAX_REQUEST_TOTAL_MB
        value: "40"
      - key: MAX_FILES
        value: "50"
      - key: RENAMED_FILE_PREFIX
        value: "vin_img"
      - key: SPOOL_UPLOADS_TO_DISK
        value: "true"
      - key: UPLOAD_READ_CHUNK_KB
        value: "1024"
      - key: ENABLE_AI_LABEL
        value: "true"
      - key: DISABLE_AI_ON_LOW_MEMORY
        value: "true"
      - key: LOW_MEMORY_RAM_MB_THRESHOLD
        value: "700"
      - key: AI_ASSISTED_STATUS
        value: "true"
      - key: AI_FASTPATH_SKIP_STRONG_RULES
        value: "true"
      - key: AI_DISABLE_ABOVE_FILES
        value: "24"
      - key: AI_MIN_CONFIDENCE
        value: "0.70"
      - key: AI_PROMOTE_GOOD_CONFIDENCE
        value: "0.90"
      - key: AI_BORDERLINE_FACTOR
        value: "0.90"
      - key: DARK_PROMOTE_MIN_BRIGHTNESS
        value: "45"
      - key: OVEREXPOSED_PROMOTE_MAX_BRIGHTNESS
        value: "210"
      - key: PERSIST_WORKERS
        value: "6"
      - key: PERSIST_WORKERS_MAX_SAFE
        value: "2"
      - key: UPLOAD_JOB_WORKERS
        value: "2"
      - key: UPLOAD_JOB_WORKERS_MAX_SAFE
        value: "1"
      - key: JOB_RETENTION_MINUTES
        value: "60"
      - key: PERSIST_TASK_TIMEOUT_SECONDS
        value: "30"
      - key: PERSIST_OVERALL_TIMEOUT_SECONDS
        value: "90"
      - key: S3_CONNECT_TIMEOUT_SECONDS
        value: "3"
      - key: S3_READ_TIMEOUT_SECONDS
        value: "12"
      - key: S3_MAX_ATTEMPTS
        value: "2"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "8"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "30"
      - key: MAX_ZIP_ITEMS
        value: "400"
      - key: MAX_ZIP_SOURCE_BYTES_MB
        value: "500"
